<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verify Email - UA Event</title>
  <style>
    body { font-family: "Inter", sans-serif; background: #f7f9fc; padding: 40px; display: grid; place-items: center; min-height: 90vh; }
    .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 14px 28px rgba(11,47,107,0.1); max-width: 400px; text-align: center; }
    input { font-size: 24px; letter-spacing: 4px; text-align: center; width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #ccc; border-radius: 12px; }
    button { background: #0b2f6b; color: white; border: none; padding: 14px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; }
    .error { color: #d32f2f; font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color: #0b2f6b; margin-top:0;">Email Verification</h2>
    <p>We sent a 6-digit code to <strong>{{ email }}</strong>. Please check your terminal/inbox and enter it below.</p>
    
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{% url 'verify_otp' %}">
      {% csrf_token %}
      <input type="text" name="otp" maxlength="6" pattern="\d{6}" placeholder="000000" required autocomplete="off">
      <button type="submit">Verify & Continue</button>
    </form>
  </div>
</body>
</html>
