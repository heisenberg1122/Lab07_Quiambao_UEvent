<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — UA Event</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{margin:0;min-height:100vh;font-family:"Inter",Arial,sans-serif;color:#12213f;background:radial-gradient(circle at top left, rgba(31,95,168,.12), transparent 28%),linear-gradient(180deg,#f7f9fc,#eef3fb);padding:32px}
    .login-shell{position:relative;max-width:1120px;margin:0 auto}
    .login-container{max-width:460px;margin:50px auto;padding:40px;background:rgba(255,255,255,.94);border-radius:28px;box-shadow:0 28px 60px rgba(11,47,107,.12);}
    .login-kicker{letter-spacing:.18em;text-transform:uppercase;font-size:.76rem;color:#f0b429;font-weight:800}
    .login-container h2{margin:10px 0 20px;font-size:2.5rem;color:#0b2f6b}
    
    .auth-toggle { display: flex; background: #eef3fb; border-radius: 12px; margin-bottom: 24px; padding: 4px; }
    .toggle-btn { flex: 1; padding: 12px; text-align: center; font-weight: bold; border-radius: 8px; cursor: pointer; color: #5d6c86; transition: 0.2s; }
    .toggle-btn.active { background: white; color: #0b2f6b; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

    .login-form{display:grid;gap:18px}
    .login-container label{display:grid;gap:8px;font-weight:700;color:#10254a}
    .login-container input{width:100%;padding:14px 15px;border-radius:14px;border:1px solid rgba(11,47,107,.16);background:rgba(255,255,255,.96);font:inherit;}
    .login-container input:focus{outline:3px solid rgba(240,180,41,.4);}
    .email-field[hidden]{display:none !important;}
    .login-actions{margin-top:10px;display:flex;gap:12px;flex-direction: column;}
    .login-actions .button{width: 100%;}
    
    #error-message {
      display: none; 
      color: #d32f2f; 
      background: #ffebee; 
      border: 1px solid #ffcdd2;
      padding: 12px; 
      border-radius: 12px; 
      margin-bottom: 20px; 
      font-weight: 600; 
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="login-shell">
  <section class="login-container">
    <div class="logo-container" style="margin-bottom: 20px;">
      <img src="logo.png" alt="UA Logo" class="nav-logo" style="height: 45px;" />
    </div>

    <div class="login-kicker">Secure Access</div>
    <h2 id="form-title">Sign In</h2>
    
    <div id="error-message"></div>

    <div class="auth-toggle">
      <div class="toggle-btn active" id="btn-login" onclick="switchMode('login')">Sign In</div>
      <div class="toggle-btn" id="btn-register" onclick="switchMode('register')">Create Account</div>
    </div>

    <form id="student-login-form" class="login-form" method="post" action="#">
      <label>
        Student Number
        <input name="student_number" type="text" inputmode="numeric" pattern="[0-9]*" required />
      </label>
      <label class="email-field" id="email-field" hidden>
        Student Email
        <input id="student-email-input" name="student_email" type="email" placeholder="you@ua.edu.ph" pattern=".*@ua\.edu\.ph$" title="Must be a valid @ua.edu.ph email address" />
      </label>
      
      <div class="login-actions">
        <button class="button" type="submit" id="submit-btn">Sign In</button>
        <a class="button button-ghost" href="index.html" style="text-align: center;">Cancel</a>
      </div>
    </form>
  </section>
  </main>

  <script>
    let currentMode = 'login'; 

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-login').classList.toggle('active', mode === 'login');
      document.getElementById('btn-register').classList.toggle('active', mode === 'register');
      document.getElementById('form-title').innerText = mode === 'login' ? 'Sign In' : 'Create Account';
      document.getElementById('submit-btn').innerText = mode === 'login' ? 'Sign In' : 'Verify & Create Account';
      document.getElementById('error-message').style.display = 'none';

      const emailField = document.getElementById('email-field');
      const emailInput = document.getElementById('student-email-input');
      if (emailField && emailInput) {
        const registerMode = mode === 'register';
        emailField.hidden = !registerMode;
        emailInput.required = registerMode;
        emailInput.value = registerMode ? emailInput.value : '';
      }
    }

    (function(){
      function qs(name){
        name = name.replace(/[\[\]]/g, '\\$&');
        const match = location.search.match(new RegExp('[?&]'+name+'=([^&]*)'));
        return match ? decodeURIComponent(match[1]) : null;
      }

      const errorMsg = qs('error');
      if (errorMsg) {
        const errDiv = document.getElementById('error-message');
        errDiv.textContent = errorMsg;
        errDiv.style.display = 'block';
      }

      const backendOrigin = `${window.location.protocol}//${window.location.hostname}:8000`;
      const nextVal = qs('next') || 'http://localhost:5173/';

      const form = document.getElementById('student-login-form');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const studentNumber = form.elements['student_number'].value.trim();
        const studentEmail = form.elements['student_email'].value.trim();

        if (currentMode === 'register') {
          if (!studentEmail.endsWith('@ua.edu.ph')) {
            alert('Security Check: You must use a valid @ua.edu.ph email address.');
            return;
          }
        }

        const url = new URL(`${backendOrigin}/accounts/student-login/`);
        url.searchParams.set('student_number', studentNumber);
        url.searchParams.set('action', currentMode);
        url.searchParams.set('next', nextVal);

        if (currentMode === 'register') {
          url.searchParams.set('student_email', studentEmail);
          localStorage.setItem('ueventStudentEmail', studentEmail);
        }

        localStorage.setItem('ueventStudentNumber', studentNumber);
        if (currentMode === 'login' && !localStorage.getItem('ueventStudentEmail')) {
          localStorage.removeItem('ueventStudentEmail');
        }

        window.location.href = url.toString();
      });
    })();
  </script>
</body>
</html>
