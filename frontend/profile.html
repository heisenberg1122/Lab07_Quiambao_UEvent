<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile — UA Event</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .profile-header {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 40px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 250, 255, 0.94));
      border-bottom: 1px solid rgba(11, 47, 107, 0.08);
      border-radius: 28px 28px 0 0;
    }
    .avatar-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(31, 95, 168, 0.12);
      color: var(--blue);
      display: grid;
      place-items: center;
      box-shadow: inset 0 4px 8px rgba(11, 47, 107, 0.06);
    }
    .avatar-circle svg { width: 44px; height: 44px; fill: currentColor; }
    .profile-info h2 { margin: 0 0 4px; font-size: 2.2rem; color: var(--navy); }
    .profile-info p { margin: 0; color: var(--muted); font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
    .profile-body { padding: 40px; }
    .empty-state { padding: 40px; text-align: center; background: rgba(247, 249, 252, 0.6); border: 1px dashed rgba(11, 47, 107, 0.15); border-radius: 18px; color: var(--muted); margin-top: 16px; }
    .logout-container { margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(11, 47, 107, 0.08); display: flex; justify-content: flex-end; }
    .btn-danger { color: #d32f2f; border-color: rgba(211, 47, 47, 0.4); }
    .btn-danger:hover { background: rgba(211, 47, 47, 0.08); box-shadow: 0 10px 20px rgba(211, 47, 47, 0.1); }
    .registration-card { display: grid; gap: 8px; padding: 18px 20px; border: 1px solid rgba(11, 47, 107, 0.08); border-radius: 18px; background: linear-gradient(180deg, #fff 0%, #f8fbff 100%); }
    .registration-card h4 { margin: 0; font-size: 1.08rem; color: var(--navy); }
    .registration-meta { display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 0.94rem; }
    .registration-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .registration-badge { display: inline-flex; align-items: center; width: fit-content; padding: 6px 10px; border-radius: 999px; background: rgba(31, 95, 168, 0.12); color: var(--blue); font-weight: 700; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="background-orb orb-one"></div>
  <div class="background-orb orb-two"></div>

  <header class="topbar">
    <div class="logo-container">
      <img src="logo.png" alt="UA Logo" class="nav-logo" />
      <div>
        <p class="eyebrow">UA Event</p>
        <h1>My Profile</h1>
      </div>
    </div>
    <div class="profile-actions">
      <a class="button button-secondary" href="index.html">Back to Events</a>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <div class="profile-header">
        <div class="avatar-circle">
          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <div class="profile-info">
          <p class="eyebrow">Student Account</p>
          <h2 id="display-student-number">Loading...</h2>
          <p>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span id="display-student-email">Please log in.</span>
          </p>
        </div>
      </div>
      
      <div class="profile-body">
        <div class="section-heading student-view-heading">
          <div>
            <p class="eyebrow">Activity Log</p>
            <h3>My Registered Events</h3>
          </div>
        </div>
        
        <div id="profile-events-list" class="event-list">
          <div class="empty-state">
            <p>Your registered events will appear here.</p>
          </div>
        </div>

        <div class="logout-container">
          <button id="profile-logout-btn" class="button button-ghost btn-danger">Sign Out</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE_URL = `${window.location.protocol}//${window.location.hostname}:8000/api`;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatEventDate(dateValue) {
      if (!dateValue) {
        return 'Date not set';
      }

      const parsedDate = new Date(dateValue);
      if (Number.isNaN(parsedDate.getTime())) {
        return dateValue;
      }

      return parsedDate.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
      });
    }

    function renderRegistrationCard(registration) {
      const title = registration.event_title || `Event #${registration.event}`;
      const date = formatEventDate(registration.event_date);
      const location = registration.event_location || 'Location not set';

      return `
        <article class="registration-card">
          <div class="registration-badge">Registered</div>
          <h4>${escapeHtml(title)}</h4>
          <div class="registration-meta">
            <span><strong>Date:</strong> ${escapeHtml(date)}</span>
            <span><strong>Location:</strong> ${escapeHtml(location)}</span>
            <span><strong>Registered:</strong> ${escapeHtml(new Date(registration.created_at).toLocaleString())}</span>
          </div>
        </article>
      `;
    }

    async function loadRegistrations() {
      const list = document.getElementById('profile-events-list');

      try {
        const response = await fetch(`${API_BASE_URL}/registrations/`, {
          credentials: 'include',
        });

        if (!response.ok) {
          throw new Error(`Status ${response.status}`);
        }

        const registrations = await response.json();

        if (!Array.isArray(registrations) || registrations.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <p>Your registered events will appear here.</p>
            </div>
          `;
          return;
        }

        list.innerHTML = registrations.map(renderRegistrationCard).join('');
      } catch (error) {
        console.error('Failed to load registrations', error);
        list.innerHTML = `
          <div class="empty-state">
            <p>Unable to load your registered events right now.</p>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const studentNumber = localStorage.getItem('ueventStudentNumber');
      const studentEmail = localStorage.getItem('ueventStudentEmail');

      if (studentNumber && studentEmail) {
        document.getElementById('display-student-number').textContent = studentNumber;
        document.getElementById('display-student-email').textContent = studentEmail;
      } else {
        document.getElementById('display-student-number').textContent = 'Guest User';
        document.getElementById('display-student-email').textContent = 'No email associated with this session.';
      }

      document.getElementById('profile-logout-btn').addEventListener('click', () => {
        localStorage.removeItem('ueventStudentNumber');
        localStorage.removeItem('ueventStudentEmail');
        
        const backendOrigin = `${window.location.protocol}//${window.location.hostname}:8000`;
        const frontendLoginUrl = `${window.location.protocol}//${window.location.hostname}:5173/login.html`;
        window.location.href = `${backendOrigin}/accounts/logout/?next=${encodeURIComponent(frontendLoginUrl)}`;
      });

      loadRegistrations();
    });
  </script>
</body>
</html>
